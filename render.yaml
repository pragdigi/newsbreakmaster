services:
  - type: web
    name: newsbreakmaster
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: FLASK_SECRET_KEY
        generateValue: true
      # Outbrain / Teads (Amplify API). Provide a long-lived OB-TOKEN-V1 OR a
      # username + password (auto-login). Set in the Render dashboard.
      - key: OUTBRAIN_ACCESS_TOKEN
        sync: false
      - key: OUTBRAIN_USERNAME
        sync: false
      - key: OUTBRAIN_PASSWORD
        sync: false
      - key: OUTBRAIN_DEFAULT_MARKETER_IDS
        sync: false
      # Public base URL Outbrain's image crawler can reach to fetch creatives
      # (defaults to AGENT_BASE_URL / RENDER_EXTERNAL_URL when blank).
      - key: OUTBRAIN_PUBLIC_BASE_URL
        sync: false
      # MediaGo (native DSP). AM-issued Base64 API token — exchanged for a
      # short-lived Bearer token at runtime. Missing vars do not fail boot;
      # the login form is the fallback.
      - key: MEDIAGO_API_TOKEN
        sync: false
      - key: MEDIAGO_AUTH_LEVEL
        sync: false
      - key: MEDIAGO_DEFAULT_ACCOUNT_IDS
        sync: false
      - key: MEDIAGO_PUBLIC_BASE_URL
        sync: false
