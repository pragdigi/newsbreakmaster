<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ active_platform_label }} Launcher{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="nb-header">
    <a class="nb-brand" href="{{ url_for('dashboard') }}">
      <img src="{{ url_for('static', filename='logo.svg') }}" alt="{{ active_platform_label }} Launcher" height="40">
    </a>
    <nav class="nb-nav">
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('launch') }}">Bulk launch</a>
      <a href="{{ url_for('scaling') }}">Scaling</a>
      <a href="{{ url_for('rules_page') }}">Rules</a>
      <a href="{{ url_for('settings_page') }}">Offers</a>
      <a href="{{ url_for('sources_page') }}">Sources</a>
      <a href="{{ url_for('studio_page') }}">AI Studio</a>
      <form method="post" action="{{ url_for('platform_switch') }}" class="nb-platform-switcher" title="Active ad platform">
        <input type="hidden" name="next" value="{{ request.full_path if request.query_string else request.path }}">
        <label class="nb-platform-label" for="nb-platform-select">Platform</label>
        <select id="nb-platform-select" name="platform" class="nb-platform-select" onchange="this.form.submit()">
          {% for p in available_platforms %}
          <option value="{{ p.id }}" {% if p.id == active_platform %}selected{% endif %}>{{ p.label }}</option>
          {% endfor %}
        </select>
      </form>
      <a href="{{ url_for('logout') }}">Log out</a>
    </nav>
  </header>
  <main class="nb-main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
